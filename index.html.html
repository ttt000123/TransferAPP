<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楽得乗換プランナー</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">🚄 楽得乗換プランナー</h1>
            <span class="text-xs bg-blue-700 px-2 py-1 rounded">任意の駅に対応</span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">
        
        <!-- 入力カード -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
            <h2 class="font-bold text-sm text-slate-600">任意駅のルート検索</h2>
            
            <!-- 出発地 -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">出発駅</label>
                <input type="text" id="origin" list="station-list" placeholder="例: 京都、大阪、西明石など" value="大阪" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- 目的地 -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">到着駅</label>
                <input type="text" id="destination" list="station-list" placeholder="例: 姫路、岡山、広島など" value="岡山" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- 駅候補リスト -->
            <datalist id="station-list">
                <option value="京都"></option>
                <option value="高槻"></option>
                <option value="新大阪"></option>
                <option value="大阪"></option>
                <option value="三ノ宮"></option>
                <option value="神戸"></option>
                <option value="明石"></option>
                <option value="西明石"></option>
                <option value="姫路"></option>
                <option value="相生"></option>
                <option value="岡山"></option>
                <option value="広島"></option>
                <option value="和歌山"></option>
            </datalist>

            <!-- 許容コスト -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-500">時短の許容コスト（1分短縮につき）</label>
                    <span class="text-xs font-bold text-blue-600"><span id="costVal">30</span>円 / 分</span>
                </div>
                <input type="range" id="costPerMin" min="10" max="100" value="30" class="w-full accent-blue-600" oninput="document.getElementById('costVal').innerText = this.value">
            </div>

            <button onclick="calcRoutes()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-sm active:scale-95">
                最適ルートを判定する
            </button>
        </div>

        <!-- 結果表示エリア -->
        <div id="results" class="space-y-3">
            <!-- JavaScriptで動的に挿入されます -->
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center py-4 text-xs text-slate-400">
        &copy; 楽得乗換プランナー (自分用)
    </footer>

    <!-- ロジック用スクリプト -->
    <script>
        // 主要駅のダミー座標・区間メタデータ（関西方針を反映）
        const stationZone = {
            "京都": { zone: "east", distance: 0 },
            "高槻": { zone: "east", distance: 20 },
            "新大阪": { zone: "core", distance: 38 },
            "大阪": { zone: "core", distance: 40 },
            "三ノ宮": { zone: "core", distance: 70 },
            "神戸": { zone: "core", distance: 72 },
            "明石": { zone: "core", distance: 90 },
            "西明石": { zone: "border", distance: 94 },
            "姫路": { zone: "border", distance: 130 },
            "相生": { zone: "west", distance: 150 },
            "岡山": { zone: "west", distance: 220 },
            "広島": { zone: "west", distance: 380 }
        };

        function calcRoutes() {
            const origin = document.getElementById('origin').value.trim();
            const dest = document.getElementById('destination').value.trim();
            const userCostPerMin = parseInt(document.getElementById('costPerMin').value);
            const container = document.getElementById('results');

            if (!origin || !dest) {
                alert("出発駅と到着駅を入力してください。");
                return;
            }

            container.innerHTML = '';

            // 駅データ取得または概算計算
            const stOrigin = stationZone[origin] || { zone: "core", distance: 40 };
            const stDest = stationZone[dest] || { zone: "west", distance: 200 };

            const dist = Math.abs(stDest.distance - stOrigin.distance) || 100;
            
            // 姫路・西明石以西が含まれるか判定
            const isWestOfHimeji = (stOrigin.zone === "west" || stDest.zone === "west" || stOrigin.zone === "border" || stDest.zone === "border");

            // 1. 標準ルート（新快速ベース）
            const stdTime = Math.round(dist * 0.8 + 15);
            const stdCost = Math.round(dist * 18 + 200);

            // 2. 有料（特急・新幹線）ハイブリッド
            let expTime, expCost, expDesc;
            if (isWestOfHimeji) {
                expTime = Math.round(stdTime * 0.35); // 姫路以西の新幹線で大幅短縮
                expCost = stdCost + Math.round(dist * 12 + 1000);
                expDesc = "京都〜大阪・西明石までは新快速で移動し、姫路以西から新幹線/特急で一気にショートカット！";
            } else {
                expTime = Math.round(stdTime * 0.7);
                expCost = stdCost + 750;
                expDesc = "一部区間で有料特急（着席保証）を利用し、快適に移動。";
            }

            const addCost = expCost - stdCost;
            const addTime = stdTime - expTime;
            const yenPerMin = addTime > 0 ? Math.round(addCost / addTime) : 0;

            // 3. 各駅・早出ルート
            const earlyTime = stdTime + 15;
            const earlyCost = stdCost;

            const html = `
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-bold text-sm text-slate-700">診断結果: ${origin} ➔ ${dest}</h3>
                    <a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin + '駅')}&destination=${encodeURIComponent(dest + '駅')}&travelmode=transit" target="_blank" class="text-xs text-blue-600 underline">Google Mapsで確認</a>
                </div>

                <!-- 1. 標準ルート -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-2">
                    <div class="flex justify-between items-start">
                        <span class="text-xs px-2 py-0.5 rounded bg-amber-100 text-amber-700 font-bold">混雑: 高〜中</span>
                        <span class="font-bold text-slate-900">${stdCost.toLocaleString()}円</span>
                    </div>
                    <h4 class="font-bold text-sm text-blue-600">① 標準ルート（京都〜姫路 新快速ベース）</h4>
                    <p class="text-xs text-slate-600">最速の無料種別（新快速）を組み合わせる基本ルート。</p>
                    <div class="text-xs text-slate-500 pt-1 border-t">所要時間: <b>約 ${stdTime}分</b></div>
                </div>

                <!-- 2. 時短・快適ルート -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-2">
                    <div class="flex justify-between items-start">
                        <span class="text-xs px-2 py-0.5 rounded ${yenPerMin <= userCostPerMin ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'} font-bold">快適・着席確実</span>
                        <span class="font-bold text-slate-900">${expCost.toLocaleString()}円</span>
                    </div>
                    <h4 class="font-bold text-sm text-blue-600">② 一部有料ルート（新幹線・特急ショートカット）</h4>
                    <p class="text-xs text-slate-600">${expDesc}</p>
                    <div class="text-xs text-slate-500 pt-1 border-t">所要時間: <b>約 ${expTime}分</b> （${addTime}分短縮）</div>
                    <div class="mt-2 text-xs p-2 rounded bg-slate-50 border">
                        💡 1分短縮のコスト: <b>${yenPerMin}円/分</b> 
                        （設定値: ${userCostPerMin}円/分）➔ ${yenPerMin <= userCostPerMin ? '✅ 投資価値あり！' : '⚠️ 少し割高です'}
                    </div>
                </div>

                <!-- 3. 各駅・早出ルート -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-2">
                    <div class="flex justify-between items-start">
                        <span class="text-xs px-2 py-0.5 rounded bg-blue-100 text-blue-700 font-bold">混雑: 低（着席優先）</span>
                        <span class="font-bold text-slate-900">${earlyCost.toLocaleString()}円</span>
                    </div>
                    <h4 class="font-bold text-sm text-blue-600">③ 早出・各駅停車ルート（ゆったり移動）</h4>
                    <p class="text-xs text-slate-600">10〜15分早めに出発し、始発列車や各駅停車を乗り継いで座って移動。</p>
                    <div class="text-xs text-slate-500 pt-1 border-t">所要時間: <b>約 ${earlyTime}分</b></div>
                    <div class="mt-2 text-xs p-2 rounded bg-blue-50 text-blue-700 border border-blue-100">
                        🌿 追加料金0円でストレスなく快適に移動できます。
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // 初回実行
        window.onload = calcRoutes;
    </script>
</body>
</html>
